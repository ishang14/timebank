services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: timebank
      POSTGRES_PASSWORD: timebank
      POSTGRES_DB: timebank
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timebank"]
      interval: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build: ./server
    environment:
      DATABASE_URL: postgresql://timebank:timebank@postgres:5432/timebank
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change-me-in-production
      PORT: 4000
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build: ./client
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
